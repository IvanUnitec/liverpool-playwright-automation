name: Liverpool Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Indicamos la subcarpeta exacta donde está el package.json real
        run: |
          cd liverpool-playwright-automation/liverpool-playwright-automation
          npm install

      - name: Install Playwright browser
        run: |
          cd liverpool-playwright-automation/liverpool-playwright-automation
          npx playwright install --with-deps chromium

      - name: Run tests headless
        env:
          HEADLESS: "true"
        run: |
          cd liverpool-playwright-automation/liverpool-playwright-automation
          npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: liverpool-playwright-automation/liverpool-playwright-automation/playwright-report/
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: liverpool-playwright-automation/liverpool-playwright-automation/test-results/
          retention-days: 14
